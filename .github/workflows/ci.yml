name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in
# progress instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # The examples below run in release mode to check what they print, not
    # to time anything: fat LTO and one codegen unit would only make every
    # run compile for minutes longer.
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      # The default features are what most users build: `std` without
      # `mmap` or `simd`.
      - run: cargo test
      - run: cargo test --no-default-features
      - run: cargo run --release --example quickstart
      # A small catalog through every stage: build, additions, removals,
      # both compactions, the snapshot written, read and mapped, searches.
      - run: cargo run --release --features mmap,simd --example lifecycle -- 300 400 20000 60
      # Audio fingerprinted by `audiofp`, indexed and searched here.
      - run: cargo run --release --example audiofp

  test-32bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo test --all-features --target i686-unknown-linux-gnu

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features
      # The default features are what most users build: `std` without `mmap`
      # or `simd`.
      - run: cargo clippy --all-targets
      - run: cargo clippy --lib --no-default-features
      # Without `--cfg docsrs`, which turns on the nightly-only `doc_cfg`
      # feature; docs.rs sets it on its own nightly build.
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Each reader against damaged files for a minute a target: a load under
  # the full checks either fails or gives a catalog that searches, changes
  # and compacts without a panic.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - working-directory: fuzz
        run: |
          for target in raw snapshot store; do
            cargo fuzz run -O "$target" -- -max_total_time=60 -timeout=10
          done

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      # The library's minimum: the examples' dev-dependency `audiofp` needs
      # 1.93, so the tests and examples are checked on stable only.
      - run: cargo check --lib --all-features
      - run: cargo check --lib --no-default-features

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi, wasm32-unknown-unknown
      - run: cargo check --lib --no-default-features --target thumbv7em-none-eabi
      - run: cargo check --lib --no-default-features --target wasm32-unknown-unknown
      - run: cargo check --lib --target wasm32-unknown-unknown
