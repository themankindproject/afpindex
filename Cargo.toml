[package]
name         = "hashtally"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.89"
description  = "Exact in-memory inverted index for landmark audio fingerprints: sorted postings, a radix directory and a two-pass vote search"
license      = "MIT"
documentation = "https://docs.rs/hashtally"
repository   = "https://github.com/themankindproject/hashtally"
readme       = "README.md"
keywords     = ["audio", "fingerprint", "inverted-index", "search", "no-std"]
categories   = ["multimedia::audio", "data-structures", "no-std"]
include      = ["/src/**", "/examples/**", "/tests/**", "/Cargo.toml", "/README.md", "/docs/**", "/LICENSE", "/CHANGELOG.md"]

[features]
default = ["std"]
# Snapshot files (`Catalog` / `Segment` `write_to` and `read_from`) and
# `std::error::Error` for the snapshot error type.
std = []
# Memory-mapped snapshots: `Catalog::map_from` and `Segment::map_from`
# leave the packed postings in the file's pages, shared between
# processes. The mapping call is the crate's one `unsafe` block.
mmap = ["std", "dep:memmap2"]
# Vector instructions for the passes that read many packed values. On
# x86-64 a CPU with AVX2, detected when a pass starts, decodes eight
# values at a time; everything else runs the same code as without the
# feature. Entering the AVX2 code is the feature's one `unsafe` block.
simd = ["std"]

[dependencies]
# `sqrt` and `ceil` without `std`; also used under `std` so results are
# bit-identical across the two builds.
libm = { version = "0.2", default-features = false }
memmap2 = { version = "0.9", optional = true }

[dev-dependencies]
# `examples/audiofp.rs` only: the fingerprinter this index is shaped for.
# It needs Rust 1.93; the crate's minimum version is the library's.
audiofp = "0.4.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto           = "fat"
codegen-units = 1

[lints.rust]
missing_docs = "deny"
unsafe_code  = "deny"
missing_debug_implementations = "warn"
# Set by `cargo fuzz`: the checksums pass, so mutations reach the parsers.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Index arithmetic between `u32` ids and `usize` positions is the whole
# point of the layout; the casts are documented at the type boundaries.
cast_possible_truncation = "allow"
cast_possible_wrap       = "allow"
cast_precision_loss      = "allow"
cast_sign_loss           = "allow"
cast_lossless            = "allow"
module_name_repetitions  = "allow"
must_use_candidate       = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
many_single_char_names   = "allow"
# A vector kernel can only be inlined into code compiled with its
# instructions, so what lies between a pass and its kernel must be inlined
# into the pass rather than left to the inliner (see `src/simd.rs`).
inline_always            = "allow"

[[example]]
name = "replay"
required-features = ["std"]

[[example]]
name = "lifecycle"
required-features = ["std"]

[[example]]
name = "profile"
required-features = ["mmap"]
